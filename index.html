<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSmart - Your One-Stop Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Poppins', sans-serif;
        }

        .fadeIn {
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .season-selector {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }

        .product-card:hover {
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white p-8 rounded-lg w-96">
            <h2 class="text-2xl font-bold mb-6">Login</h2>
            <form id="loginForm">
                <input type="email" placeholder="Email" class="w-full mb-4 p-2 border rounded" required>
                <input type="password" placeholder="Password" class="w-full mb-4 p-2 border rounded" required>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Login</button>
            </form>
            <p class="mt-4 text-center">Don't have an account? <a href="#" id="showSignup" class="text-blue-600">Sign up</a></p>
            <button onclick="closeModal('loginModal')" class="absolute top-2 right-2 text-gray-600 hover:text-gray-800">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </div>

    <!-- Season Selection Modal -->
    <div id="seasonModal" class="fixed inset-0 bg-black bg-opacity-50 z-50">
        <div class="season-selector absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white p-8 rounded-lg w-96">
            <h2 class="text-2xl font-bold mb-6 text-center">Select Your Season</h2>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="selectSeason('Summer')" class="p-4 bg-yellow-100 rounded-lg hover:bg-yellow-200 transition">
                    <i class="bi bi-sun text-3xl"></i>
                    <p>Summer</p>
                </button>
                <button onclick="selectSeason('Winter')" class="p-4 bg-blue-100 rounded-lg hover:bg-blue-200 transition">
                    <i class="bi bi-snow text-3xl"></i>
                    <p>Winter</p>
                </button>
                <button onclick="selectSeason('Spring')" class="p-4 bg-green-100 rounded-lg hover:bg-green-200 transition">
                    <i class="bi bi-flower1 text-3xl"></i>
                    <p>Spring</p>
                </button>
                <button onclick="selectSeason('Fall')" class="p-4 bg-orange-100 rounded-lg hover:bg-orange-200 transition">
                    <i class="bi bi-tree text-3xl"></i>
                    <p>Fall</p>
                </button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-white shadow-sm">
        <nav class="container mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <div class="text-2xl font-bold text-blue-600">ShopSmart</div>
                <div class="flex items-center space-x-6">
                    <button onclick="showLoginModal()" class="text-gray-600 hover:text-gray-800">
                        <i class="bi bi-person"></i> Login
                    </button>
                    <button class="text-gray-600 hover:text-gray-800">
                        <i class="bi bi-cart"></i> Cart
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div id="productContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Products will be dynamically loaded here -->
        </div>
    </main>

    <script>
        // Product data with seasonal categories
        const products = {
            Summer: [
                { id: 1, name: "Light Cotton T-Shirt", price: 29.99, image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab" },
                { id: 2, name: "Shorts", price: 39.99, image: "https://images.unsplash.com/photo-1591195853828-11db59a44f6b" },
                // Add more summer products
            ],
            Winter: [
                { id: 3, name: "Warm Jacket", price: 89.99, image: "https://images.unsplash.com/photo-1539533113208-f6df8cc8b543" },
                { id: 4, name: "Wool Sweater", price: 59.99, image: "https://images.unsplash.com/photo-1434389677669-e08b4cac3105" },
                // Add more winter products
            ],
            // Add Spring and Fall products similarly
        };

        let currentSeason = null;

        function selectSeason(season) {
            currentSeason = season;
            document.getElementById('seasonModal').classList.add('hidden');
            displayProducts(season);
        }

        function displayProducts(season) {
            const container = document.getElementById('productContainer');
            container.innerHTML = '';

            products[season].forEach(product => {
                const productCard = `
                    <div class="product-card bg-white p-4 rounded-lg shadow-md fadeIn">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-48 object-cover rounded-md mb-4">
                        <h3 class="text-lg font-semibold">${product.name}</h3>
                        <p class="text-gray-600">$${product.price}</p>
                        <button onclick="addToCart(${product.id})" class="mt-4 w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
                            Add to Cart
                        </button>
                    </div>
                `;
                container.innerHTML += productCard;
            });
        }

        function showLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function addToCart(productId) {
            // Implement cart functionality
            alert('Product added to cart!');
        }

        // Initialize with season selection
        document.getElementById('seasonModal').classList.remove('hidden');
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
